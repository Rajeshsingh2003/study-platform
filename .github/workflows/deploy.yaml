# Updated GitHub Actions Workflow with Docker Hub Push
name: StudyVault CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout Repository
      - name: Checkout Code
        uses: actions/checkout@v5

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # Install Backend Dependencies
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm install

      # Install Frontend Dependencies
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      # Build Frontend
      - name: Build React Frontend
        working-directory: ./frontend
        run: npm run build

      # Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build and Push Backend Image
      - name: Build and Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            rajeshgill634/studyvault-backend:latest
            rajeshgill634/studyvault-backend:${{ github.sha }}

      # Build and Push Frontend Image
      - name: Build and Push Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            rajeshgill634/studyvault-frontend:latest
            rajeshgill634/studyvault-frontend:${{ github.sha }}

      # Optional: Build Docker Compose
      - name: Docker Compose Build
        run: docker compose build

      # Save Build Logs
      - name: Collect Build Logs
        run: |
          echo "Workflow completed successfully" > /tmp/build_logs.txt
          echo "Docker images pushed to Docker Hub" >> /tmp/build_logs.txt
          echo "Commit SHA: ${{ github.sha }}" >> /tmp/build_logs.txt

      # AI Log Analysis
      - name: Run AI Log Analysis
        run: node scripts/analyze-logs.js

      # Upload Logs as Artifact
      - name: Upload Logs
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: /tmp/build_logs.txt


