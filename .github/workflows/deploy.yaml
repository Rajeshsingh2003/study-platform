name: StudyVault CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Fix 1: Give workflow permission to post comments
permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install backend deps
        id: backend-install
        run: cd backend && npm install
        continue-on-error: true

      - name: Install frontend deps
        id: frontend-install
        run: cd frontend && npm install
        continue-on-error: true

      - name: Build frontend
        id: frontend-build
        run: cd frontend && npm run build
        continue-on-error: true

      - name: Build Docker images
        id: docker-build
        run: docker compose build 2>&1 | tee /tmp/build_logs.txt
        continue-on-error: true

      - name: Collect job results
        if: always()
        run: |
          echo "BACKEND_INSTALL=${{ steps.backend-install.outcome }}" > /tmp/job_summary.txt
          echo "FRONTEND_INSTALL=${{ steps.frontend-install.outcome }}" >> /tmp/job_summary.txt
          echo "FRONTEND_BUILD=${{ steps.frontend-build.outcome }}" >> /tmp/job_summary.txt
          echo "DOCKER_BUILD=${{ steps.docker-build.outcome }}" >> /tmp/job_summary.txt
          cat /tmp/job_summary.txt

      - name: AI log analysis
        if: always()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node .github/scripts/analyze-logs.js

      - name: Post AI comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('/tmp/ai_comment.txt')) {
              const body = fs.readFileSync('/tmp/ai_comment.txt', 'utf8');
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body
              });
              console.log('Comment posted on PR successfully!');
            }

      - name: Post AI comment on Push
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('/tmp/ai_comment.txt')) {
              const body = fs.readFileSync('/tmp/ai_comment.txt', 'utf8');
              await github.rest.repos.createCommitComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
                body
              });
              console.log('Comment posted on commit successfully!');
            }